name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: PDF smoke test
        run: market-intelligence --input examples/demo_snapshot.json --out reports --allow-synthetic
      - name: PDF present
        run: test -s reports/market_intelligence.pdf && test -s reports/market_intelligence.json
